# html/ja の更新を docs.ruby-lang.org の S3 バケットへ同期する
# (ruby/ruby-infra-recipe#73 の S3 切替のデプロイ経路。従来のサーバー側
# bc-static-all の rsync を置き換える)。
#
# 認証は OIDC(ruby/ruby-infra-recipe cdn/iam.tf の docs-sync ロール。
# ja/* prefix 限定)。リポジトリ変数 DOCS_SYNC_ROLE_ARN が未設定の間は
# 何もしない(ロールの apply 前にマージしても安全)。
#
# 反映(キャッシュ purge)について: Fastly のシールド TTL は最長 48 時間
# なので、sync 後に Surrogate-Key `ja` を soft purge する。変数
# FASTLY_SERVICE_ID とシークレット FASTLY_PURGE_TOKEN(purge 権限の
# API トークン)が揃うまでこのステップはスキップされ、その間は
# サーバー側 bc-cron の日次 purge(キー体系は同一)が反映を担う。
name: sync docs bucket

on:
  push:
    branches:
      - main
    paths:
      - 'html/ja/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: sync-docs-bucket
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    if: ${{ vars.DOCS_SYNC_ROLE_ARN != '' }}
    steps:
      # html/ja だけの sparse checkout(db/ と html/en 系を落とさない)。
      # filter で必要な blob だけ取得する。fetch-depth は下の
      # restore-mtime が「最近変わったファイル」を見分けるための履歴窓
      # (gd は日次 2 コミットペースなので 60 ≒ 約 1 か月)
      - uses: actions/checkout@v7
        with:
          sparse-checkout: html/ja
          filter: 'blob:none'
          fetch-depth: 60

      # checkout 直後は全ファイルの mtime が「今」になり、aws s3 sync の
      # 既定比較(サイズが違う or ローカルの方が新しい)で毎回全件
      # アップロードになってしまう。mtime を各ファイルの最終コミット
      # 時刻に戻し、実際に変わったページだけの差分アップロードにする。
      #
      # shallow 境界(fetch-depth)より古いファイルは git log に現れず
      # restore-mtime がスタンプできない(WARNING: not found in the log)。
      # そのまま「今」の mtime が残ると全件アップロードに化けるので、
      # 先に全ファイルを固定の過去時刻へ倒しておく。バケットに無い
      # ファイルは mtime に関係なくアップロードされるので取りこぼしはない
      - name: Restore file mtimes from git history
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git-restore-mtime
          find html/ja -type f -print0 | xargs -0 touch -t 200001010000
          git restore-mtime html/ja

      # 6 時間(GitHub ホストランナーのジョブ上限)。フルアップロードに
      # なる日でもセッション切れ(ExpiredToken)にしないための保険。
      # ロール側の max_session_duration 引き上げ(ruby/ruby-infra-recipe)
      # が apply 済みであることが前提
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.DOCS_SYNC_ROLE_ARN }}
          aws-region: us-east-1
          role-duration-seconds: 21600

      # --no-follow-symlinks: html/ja の latest/master は symlink で、
      # 実体の二重アップロードになるため辿らない(本番はエイリアスを
      # Fastly の VCL が dictionary で解決する)。--delete で削除ページも
      # バケットから消す(凍結版もチェックアウトに含まれるので安全)。
      # 並列度は既定の 10 だと全ページ再生成の日(テンプレート変更など)に
      # OIDC セッションの 1 時間を超えるため引き上げる。
      # トップの ja/index.html(バージョン索引)は ruby/docs.ruby-lang.org
      # の public/ja/index.html がソースで html/ja には存在しないため、
      # --delete に消させないよう除外する(パターンはソース直下のみに
      # 一致し、各バージョン配下の index.html には影響しない)
      - name: Sync html/ja to s3://docs.r-l.o/ja
        run: |
          aws configure set default.s3.max_concurrent_requests 32
          aws s3 sync html/ja s3://docs.r-l.o/ja --delete --exclude "index.html" --no-follow-symlinks --no-progress

      # secrets コンテキストは if: 式では参照できない(workflow の
      # パースエラーになる)ため、未設定時のスキップはシェル側で判定する
      - name: Soft-purge the ja surrogate key
        run: |
          if [ -z "${FASTLY_SERVICE_ID}" ] || [ -z "${FASTLY_PURGE_TOKEN}" ]; then
            echo "FASTLY_SERVICE_ID / FASTLY_PURGE_TOKEN が未設定のため purge をスキップ(サーバー側 bc-cron の日次 purge が反映を担う)"
            exit 0
          fi
          curl -fsS -X POST "https://api.fastly.com/service/${FASTLY_SERVICE_ID}/purge/ja" \
            -H "Fastly-Key: ${FASTLY_PURGE_TOKEN}" -H "fastly-soft-purge: 1"
        env:
          FASTLY_SERVICE_ID: ${{ vars.FASTLY_SERVICE_ID }}
          FASTLY_PURGE_TOKEN: ${{ secrets.FASTLY_PURGE_TOKEN }}
