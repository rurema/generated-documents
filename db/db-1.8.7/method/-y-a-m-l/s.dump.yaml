--- dump(obj, io = nil) -> String | IO

与えられた obj を YAML フォーマットに変換し、io に書き込みます。io を返
します。io が与えられていない場合は、YAML フォーマットの文字列を返しま
す。

@param obj YAMLフォーマットに変換されるオブジェクト
@param io 出力先のIOオブジェクト

