### def doctype -> String

HTML 4.01 Transitional の DOCTYPE 宣言を返します。

```ruby title="例"
require "cgi"

cgi = CGI.new("html4Tr")
p cgi.doctype
# => "<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01 Transitional//EN\" \"http://www.w3.org/TR/html4/loose.dtd\">"
```
