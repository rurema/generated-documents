<h1>macro INT2NUM</h1><span class="permalink">[<a href="https://github.com/rurema/doctree/edit/master/manual/capi/ruby.h.md">edit</a>]</span>

</header>

<main>
<dl class="functionlist">
<dt>
  <code>VALUE INT2NUM(int i)</code>
</dt>
<dd>
<dd class="function-description">
<p>
任意の整数を <a href="../class/Integer.html">Integer</a> に変換します。
INT2FIX と異なり、Fixnum におさまらない整数も扱えます。
</p>
<span class="caption">例</span>
<pre class="highlight c"><code><span class="n">VALUE</span> <span class="n">num</span> <span class="o">=</span> <span class="n">INT2NUM</span><span class="p">(</span><span class="mi">42</span><span class="p">);</span> <span class="c1">//(Cの整数値42をRubyのオブジェクトに変換)</span>
</code></pre>
</dd>

</dd>
</dl>
